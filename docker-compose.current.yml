# Compose override for building and running the current source checkout.
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.current.yml up -d --build

services:
  new-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: zzapi-new-api:current
    volumes:
      - ./data/current/app:/data
      - ./data/current/logs:/app/logs
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy

  postgres:
    volumes:
      - ./data/dev/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d new-api"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    volumes:
      - ./data/current/redis:/data
